<style>
:root{--bg:#f6f3ec;--card:#fff;--tx:#1b1b1b;--mu:#6b6b6b;--gold:#a9822a;--bd:#e2dccd;--bad:#c0392b;--ok:#2e7d32;--btn:#1b1b1b;--btx:#f5d98b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0b;--card:#17150f;--tx:#f2ead6;--mu:#9a927c;--gold:#d4af37;--bd:#3a3220;--bad:#ff6b5b;--ok:#6fcf74;--btn:#d4af37;--btx:#111}}
:root[data-theme="dark"]{--bg:#0b0b0b;--card:#17150f;--tx:#f2ead6;--mu:#9a927c;--gold:#d4af37;--bd:#3a3220;--bad:#ff6b5b;--ok:#6fcf74;--btn:#d4af37;--btx:#111}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd);gap:8px}
header b{color:var(--gold);font-size:18px;font-family:Georgia,serif;font-style:italic}
nav{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap}
main{max-width:980px;margin:0 auto;padding:12px}
button,input,select{font:inherit;color:inherit}
button{background:var(--btn);color:var(--btx);border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.on{outline:2px solid var(--gold)}button.d{background:var(--bad);color:#fff}button:disabled{opacity:.4}
input,select{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px;width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.p{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.p small{color:var(--mu);font-weight:400}.p span{color:var(--gold)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
.sp{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--bd)}
.sp .row button{min-width:0;flex:0 0 auto;padding:9px 16px}
.sp:last-child{border:0}.mu{color:var(--mu)}.bad{color:var(--bad)}.ok{color:var(--ok)}
.tot{font-size:22px;font-weight:700;color:var(--gold)}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:6px;text-align:left;border-bottom:1px solid var(--bd)}td.r,th.r{text-align:right}
.login{max-width:340px;margin:12vh auto;padding:12px}.login input{background:rgba(23,21,15,.85);color:#f2ead6;border-color:#3a3220}.login .bad{color:#ff6b5b}.login h1{font:italic 40px Georgia,serif;color:var(--gold);text-align:center;margin:0 0 4px}
.two{display:grid;gap:12px;grid-template-columns:1fr}@media(min-width:760px){.two{grid-template-columns:2fr 1fr}}
.rep{font-family:ui-monospace,Menlo,monospace;font-size:14px}
.rep{position:relative;isolation:isolate;overflow:hidden}.rep::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--wm) center/contain no-repeat;opacity:.14;pointer-events:none;-webkit-mask-image:radial-gradient(circle at center,#000 35%,transparent 72%);mask-image:radial-gradient(circle at center,#000 35%,transparent 72%)}
.mo{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}.mo .card{width:100%;max-width:380px;margin:0;max-height:90%;overflow:auto}
@media print{.np{display:none!important}body{background:#fff;color:#000}.card{border:0}}

const pimg=p=>p.img||IMGS[String(p.name||'').trim().toLowerCase()]||'';
const VERSION='24-oct-2026 · fondo de apertura, transferencia y compras múltiples';
const uid=()=>Math.random().toString(36).slice(2,9)+Math.random().toString(36).slice(2,5);
/* ---------- Conexión con el servidor ---------- */
const emptyS=()=>({cats:[],prods:[],credits:[],buys:[],hist:[],log:[],users:[],cash:{open:false},cfg:null,movs:[],rprofs:[],rpers:[],rpays:[]});
let S=emptyS(),token=null,base={},sig='',saving=false,dirty=false,lastSave=0,offline=false,pollBusy=false,lastBackup=0;
try{lastBackup=+localStorage.getItem('lb')||0}catch(e){}
const canon=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.fromEntries(Object.keys(x).sort().map(y=>[y,x[y]])):x);
async function api(path,body,noAuth){
  const r=await fetch(path,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},token&&!noAuth?{Authorization:'Bearer '+token}:{}),body:JSON.stringify(body||{})});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&!noAuth){forceLogout();throw{status:401}}
  if(!r.ok)throw{status:r.status,msg:j.error};
  return j;
}
function toRecs(S){
  const R={},c=S.cash,{sales,tabs,expenses,cols,...meta}=c;
  R['meta:cats']={list:S.cats};
  S.prods.forEach(p=>R['prod:'+p.id]=p);
  S.credits.forEach(k=>R['cred:'+k.id]=k);
  [...S.buys].reverse().forEach(b=>R['buy:'+b.id]=b);
  [...S.hist].reverse().forEach(r=>R['hist:'+r.id]=r);
  S.log.forEach(e=>{if(!e.id)e.id=uid();R['log:'+e.id]=e});
  (S.movs||[]).forEach(m=>R['log:'+m.id]=Object.assign({},m,{type:'mov',mt:m.type}));
  (S.rprofs||[]).forEach(x=>R['log:'+x.id]=Object.assign({},x,{type:'rprof'}));(S.rpers||[]).forEach(x=>R['log:'+x.id]=Object.assign({},x,{type:'rper'}));(S.rpays||[]).forEach(x=>R['log:'+x.id]=Object.assign({},x,{type:'rpay'}));
  if(S.cfg)R['log:cfg']=Object.assign({},S.cfg,{type:'cfg',id:'cfg'});
  R['cash:meta']=meta;
  (sales||[]).forEach(x=>R['sale:'+x.id]=x);(tabs||[]).forEach(x=>R['tab:'+x.id]=x);
  (expenses||[]).forEach(x=>R['exp:'+x.id]=x);(cols||[]).forEach(x=>R['col:'+x.id]=x);
  return R;
}
function fromRecs(rows,users){
  const N=emptyS(),c={sales:[],tabs:[],expenses:[],cols:[]};let meta={open:false};N.users=users||[];
  rows.forEach(({k,v})=>{const i=k.indexOf(':'),t=i<0?k:k.slice(0,i);
    if(k==='meta:cats')N.cats=v.list||[];else if(k==='cash:meta')meta=v;
    else if(t==='prod')N.prods.push(v);else if(t==='cred')N.credits.push(v);
    else if(t==='buy')N.buys.unshift(v);else if(t==='hist')N.hist.unshift(v);else if(t==='log'){if(v.type==='mov')N.movs.push(Object.assign({},v,{type:v.mt}));else if(v.type==='cfg')N.cfg=v;else if(v.type==='rprof')N.rprofs.push(v);else if(v.type==='rper')N.rpers.push(v);else if(v.type==='rpay')N.rpays.push(v);else N.log.push(v)}
    else if(t==='sale')c.sales.push(v);else if(t==='tab')c.tabs.push(v);else if(t==='exp')c.expenses.push(v);else if(t==='col')c.cols.push(v)});
  N.cash=meta.open?Object.assign({},meta,c):{open:false};
  return N;
}
function diffOps(){
  const R=toRecs(S),ops=[];
  for(const k in R){
    const s=canon(R[k]);if(base[k]===s)continue;
    if(k.startsWith('prod:')&&base[k]){
      const o=JSON.parse(base[k]),n=R[k],patch={};
      for(const f in n)if(f!=='stock'&&canon(n[f])!==canon(o[f]))patch[f]=n[f];
      if(Object.keys(patch).length)ops.push({k,patch});
      if((n.stock||0)!==(o.stock||0))ops.push({k,inc:(n.stock||0)-(o.stock||0)});
    }else ops.push({k,put:R[k]});
  }
  for(const k in base)if(!(k in R))ops.push({k,del:1});
  return{ops,R};
}
const fullOps=()=>{const R=toRecs(S);return{ops:Object.keys(R).map(k=>({k,put:R[k]})),R}};
const busyInput=()=>dlg||(document.activeElement&&/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName));
async function sync(full){
  if(saving){dirty=true;return}
  saving=true;
  try{
    do{dirty=false;
      const{ops,R}=full?fullOps():diffOps();
      if(ops.length||full){await api('/api/save',{ops,replace:!!full});base={};for(const k in R)base[k]=canon(R[k])}
      full=false}while(dirty);
    if(offline){offline=false;if(!busyInput())render()}
  }catch(e){
    if(e&&e.status){if(e.status!==401){alert('El servidor no aceptó el cambio ('+(e.msg||e.status)+'). Se recargarán los datos.');try{await refresh(true)}catch(_){}}}
    else if(!offline){offline=true;if(!busyInput())render()}
  }finally{saving=false;lastSave=Date.now()}
}
const save=()=>{sync()};
function rebuildLog(){
  const out=new Map(),addAll=c=>{
    (c.sales||[]).forEach(s=>out.set(s.id,{id:s.id,t:s.t,type:'sale',total:s.total,paid:s.paid??s.total,credit:s.credit||0,method:s.method||'cash',items:(s.items||[]).map(i=>({name:i.name,amt:i.price*i.qty,qty:i.qty}))}));
    (c.expenses||[]).forEach(e=>out.set(e.id,{id:e.id,t:e.t,type:'exp',amount:e.amount,desc:e.desc}));
    (c.cols||[]).forEach(e=>out.set(e.id,{id:e.id,t:e.t,type:'col',amount:e.amount,method:e.method||'cash',client:e.client}))};
  S.hist.forEach(r=>{if(r.snap)addAll(r.snap)});addAll(S.cash);
  S.log=S.log.filter(e=>e.id&&(e.type==='buy'||e.type==='wd')).concat([...out.values()]).sort((a,b)=>a.t-b.t);
  save();
}
function applyState(r){me=r.me;S=fromRecs(r.rows,r.users);base={};r.rows.forEach(x=>base[x.k]=canon(x.v));sig=r.sig||'';if(me&&me.role==='admin'&&S.log.some(e=>!e.id))rebuildLog()}
async function refresh(force){const r=await api('/api/state',{});applyState(r);if(force)render()}
async function poll(){
  if(!token||saving||pollBusy)return;pollBusy=true;const t0=Date.now();
  try{
    const r=await api('/api/state',{sig});
    if(offline){offline=false;if(!busyInput())render()}
    if(saving||lastSave>=t0)return;
    if(diffOps().ops.length){sync();return}
    if(r.same||busyInput())return;
    applyState(r);render();
  }catch(e){if(!(e&&e.status)&&!offline){offline=true;if(!busyInput())render()}}
  finally{pollBusy=false}
}
function forceLogout(){token=null;try{localStorage.removeItem('tk')}catch(e){}me=null;S=emptyS();base={};sig='';render()}
async function boot(){
  try{token=localStorage.getItem('tk')}catch(e){}
  if(token){try{await refresh(false)}catch(e){if(!(e&&e.status))offline=true;else token=null}}
  render();setInterval(poll,4000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
}
let me=null,tab='venta',cat='Todas',cart=[],rep=null,err='',dlg=null;
function ask(title,fields,ok,msg,danger){dlg={title,fields:fields||[],ok,msg,danger};render()}
function alert(m){ask('Aviso',[],null,m)}
function dlgVis(){if(!dlg)return;const v=dlg.fields.map((f,i)=>{const e=$('#df'+i);return e?e.value:''});
  dlg.fields.forEach((f,i)=>{const w=$('#dw'+i);if(w)w.style.display=(!f.show||v[f.show[0]]===f.show[1])?'':'none'});
  const L=$('#dlive');if(L&&dlg.live){try{L.innerHTML=dlg.live(v)}catch(e){L.innerHTML=''}}}
function dlgOk(){const v=dlg.fields.map((f,i)=>$('#df'+i).value),f=dlg.ok;dlg=null;f(v);render()}
function dlgNo(){dlg=null;render()}
function dlgHTML(){if(!dlg)return'';return`<div class="mo np"><div class="card"><b>${esc(dlg.title)}</b>${dlg.msg?`<p>${esc(dlg.msg)}</p>`:''}${dlg.fields.map((f,i)=>`<div id="dw${i}"><p class="mu" style="margin:8px 0 2px">${esc(f.label)}</p>${f.opts?`<select id="df${i}" onchange="dlgVis()">${f.opts.map(o=>`<option value="${esc(o[0])}" ${o[0]===f.value?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input id="df${i}" oninput="dlgVis()" type="${f.type||'text'}" ${f.type==='number'?'inputmode="decimal"':''} value="${esc(f.value??'')}">`}</div>`).join('')}${dlg.live?'<div id="dlive" class="sp" style="margin-top:10px"></div>':''}<div class="row" style="margin-top:12px">${dlg.ok?'<button class="g" onclick="dlgNo()">Cancelar</button>':''}<button class="${dlg.danger?'d':''}" onclick="${dlg.ok?'dlgOk()':'dlgNo()'}">Aceptar</button></div></div></div>`}
const isAdmin=()=>me&&me.role==='admin';
const sold=sales=>{const m={};sales.forEach(s=>s.items.forEach(i=>{const k=i.name+'|'+i.price;(m[k]=m[k]||{name:i.name,price:i.price,qty:0}).qty+=i.qty}));return Object.values(m)};
const low=p=>p.stock<=p.min;

async function login(){
  try{
    const r=await api('/api/login',{user:$('#lu').value.trim().toLowerCase(),pass:$('#lp').value},true);
    token=r.token;try{localStorage.setItem('tk',token)}catch(e){}
    await refresh(false);err='';tab='venta';
    if(r.warn)setTimeout(()=>ask('Cambia tu contraseña',[],null,'Todavía usas la contraseña inicial (admin123). Cámbiala en Usuarios.'),0);
  }catch(e){err=e&&e.status===401?'Usuario o contraseña incorrectos':'No se pudo conectar. Revisa tu internet.'}
  render();
}
function logout(){token=null;try{localStorage.removeItem('tk')}catch(e){}me=null;S=emptyS();base={};sig='';cart=[];rep=null;rcpt=null;scan=null;nb=null;cur=null;render()}
function go(t){tab=t;rep=null;rcpt=null;hp=null;render()}

/* ---------- Caja ---------- */
let cur=null,per=1,rcpt=null;
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const isCard=x=>x.method==='card',isTrf=x=>x.method==='transfer',isBank=x=>isCard(x)||isTrf(x);
const BM={cash:'Efectivo',card:'Tarjeta',transfer:'Transferencia'};
const acctOf=m=>m==='card'||m==='transfer'?'bank':'cash';
const lastPct=()=>{try{return localStorage.getItem('cpct')||''}catch(e){return''}};
const savePct=p=>{try{localStorage.setItem('cpct',String(p))}catch(e){}};
const cin=c=>c.sales.reduce((a,s)=>a+(isBank(s)?0:(s.paid??s.total)),0);
const cardS=c=>c.sales.reduce((a,s)=>a+(isCard(s)?(s.paid??s.total):0),0);
const trfS=c=>c.sales.reduce((a,s)=>a+(isTrf(s)?(s.paid??s.total):0),0);
const ccolCard=c=>c.cols.reduce((a,e)=>a+(isCard(e)?e.amount:0),0);
const ccolTrf=c=>c.cols.reduce((a,e)=>a+(isTrf(e)?e.amount:0),0);
const cexp=c=>c.expenses.reduce((a,e)=>a+e.amount,0);
const ccol=c=>c.cols.reduce((a,e)=>a+(isBank(e)?0:e.amount),0);
const expected=c=>c.fund+cin(c)+ccol(c)-cexp(c);
const tabTotal=t=>t.items.reduce((a,i)=>a+i.qty*i.price,0);
const curTab=()=>S.cash.tabs.find(t=>t.id===cur);
function openCash(){
  const f=parseFloat($('#fund').value);if(isNaN(f)||f<0)return alert('Escribe con cuánto fondo abres la caja hoy (puede ser 0).');
  S.cash={open:true,fund:f,at:Date.now(),by:me.name,sales:[],tabs:[],expenses:[],cols:[]};save();render();
}
async function pauseCash(){await sync();while(saving)await new Promise(r=>setTimeout(r,100));logout()}
function askClose(){
  const c=S.cash;if(c.tabs.length)return alert('Hay cuentas de clientes abiertas. Cóbralas o cancélalas antes del cierre del día.');
  const cv=$('#counted').value;ask('Cierre de caja del día',[],()=>closeCash(cv),'Se cerrará definitivamente. Solo un administrador podrá reabrirla.',true);
}
function closeCash(cv){
  const c=S.cash,counted=cv===''?null:parseFloat(cv);
  const r={id:uid(),open:c.at,close:Date.now(),openedBy:c.by,closedBy:me.name,fund:c.fund,total:c.sales.reduce((a,s)=>a+s.total,0),paid:cin(c)+cardS(c)+trfS(c),cardPaid:cardS(c)+ccolCard(c),trfPaid:trfS(c)+ccolTrf(c),surch:c.sales.reduce((a,s)=>a+(s.surcharge||0),0),credit:c.sales.reduce((a,s)=>a+(s.credit||0),0),disc:c.sales.reduce((a,s)=>a+(s.discount||0),0),cols:c.cols,expenses:c.expenses,exp:expected(c),counted,items:sold(c.sales),n:c.sales.length,snap:c};
  S.hist.unshift(r);S.cash={open:false};save();
  if(isAdmin()){rep=r;render()}else ask('Caja cerrada',[],null,'La caja del día se cerró. Solo el administrador puede reabrirla o ver el cierre.');
}
function reopen(i){ask('Reabrir caja',[],()=>{if(S.cash.open)return alert('Ya hay una caja abierta');const r=S.hist[i];S.cash={...r.snap,open:true};S.hist.splice(i,1);rep=null;save()},'¿Reabrir este cierre? Volverás a la caja con sus ventas y gastos.')}
function addExp(){ask('Gasto de caja',[{label:'¿En qué se gastó? (luz, agua, limpieza…)'},{label:'Monto (RD$)',type:'number'}],v=>{
  const a=parseFloat(v[1]);if(!v[0].trim()||!(a>0))return alert('Escribe el motivo y un monto válido');
  const e={id:uid(),t:Date.now(),desc:v[0].trim(),amount:a,by:me.name};S.cash.expenses.push(e);S.log.push({id:e.id,t:e.t,type:'exp',amount:a,desc:e.desc});save()})}

  ${(r.expenses||[]).map(x=>`<div class="sp"><span>Gasto: ${esc(x.desc)}</span><span>−${money(x.amount)}</span></div>`).join('')}

  <div class="sp"><span>Efectivo esperado</span><b>${money(r.exp)}</b></div>
  ${r.counted!=null?`<div class="sp"><span>Efectivo contado</span><span>${money(r.counted)}</span></div><div class="sp"><span>Diferencia</span><b class="${r.counted-r.exp<0?'bad':'ok'}">${money(r.counted-r.exp)}</b></div>`:''}
  <div class="row np" style="margin-top:10px"><button onclick="pdfReport()">Descargar PDF</button><button class="g" onclick="window.print()">Imprimir</button><button class="g" onclick="rep=null;render()">Cerrar</button></div></div>`;
}

  if(rep&&isAdmin())return reportHTML(rep);
  const c=S.cash;let out='';

    const lc=S.hist[0],hint=lc&&lc.counted!=null?Number(lc.counted):null;

  }else{
    const tv=c.sales.reduce((a,s)=>a+s.total,0),fi=c.sales.reduce((a,s)=>a+(s.credit||0),0);

    <div class="sp"><span>Fondo inicial</span><span>${money(c.fund)}</span></div>
    <div class="sp"><span>Ventas (${c.sales.length})</span><span>${money(tv)}</span></div>
    <div class="sp"><span>Fiado hoy</span><span>${money(fi)}</span></div>
    <div class="sp"><span>Cobros de créditos (efectivo)</span><span>${money(ccol(c))}</span></div>
    <div class="sp"><span>Cobrado con tarjeta (banco)</span><span>${money(cardS(c)+ccolCard(c))}</span></div>
    <div class="sp"><span>Cobrado por transferencia (banco)</span><span>${money(trfS(c)+ccolTrf(c))}</span></div>
    <div class="sp"><span>Gastos de caja</span><span>−${money(cexp(c))}</span></div>
    <div class="sp"><span>Efectivo esperado</span><b class="tot">${money(expected(c))}</b></div></div>
    <div class="card"><div class="sp"><b>Gastos de caja</b><button onclick="addExp()">+ Gasto</button></div>${c.expenses.map(e=>`<div class="sp"><span>${esc(e.desc)} <small class="mu">${esc(e.by)}</small></span><span>${money(e.amount)}</span></div>`).join('')||'<p class="mu">Sin gastos</p>'}</div>
    <div class="card"><b>Ventas del día</b>${c.sales.map((x,i)=>[x,i]).reverse().map(([x,i])=>`<div class="sp"><span>${esc(x.client)}<br><small class="mu">${money(x.total)}${x.credit>0?' · fiado '+money(x.credit):''}</small></span><button class="g" onclick="rcpt=S.cash.sales[${i}];render()">Factura</button></div>`).join('')||'<p class="mu">Aún sin ventas</p>'}</div>
    <div class="card"><b>Productos vendidos</b>${sold(c.sales).map(i=>`<div class="sp"><span>${i.qty} × ${esc(i.name)}</span><span>${money(i.qty*i.price)}</span></div>`).join('')||'<p class="mu">Aún sin ventas</p>'}</div>
    <div class="card"><p class="mu">Efectivo contado en caja (opcional)</p><input id="counted" type="number" inputmode="decimal"><br><br>
    <div class="row"><button class="g" onclick="pauseCash()">Cierre temporal (salir)</button><button class="d" onclick="askClose()">Cierre del día</button></div>
    <p class="mu" style="font-size:13px">Temporal: sales y al volver sigues con tus cuentas abiertas. Del día: cierre definitivo.</p></div>`;

/* ---------- Venta (cuentas por cliente) ---------- */
function newTab(){ask('Nuevo cliente',[{label:'Nombre o número del cliente',value:'Cliente '+(S.cash.tabs.length+1)}],v=>{const t={id:uid(),name:v[0].trim()||'Cliente',items:[]};S.cash.tabs.push(t);cur=t.id;save()})}
function add(id){const t=curTab(),p=S.prods.find(x=>x.id===id);if(!t||p.stock<=0)return;p.stock--;const i=t.items.find(x=>x.pid===id);i?i.qty++:t.items.push({pid:id,name:p.name,price:p.price,qty:1});save();render()}
function chg(id,d){const t=curTab(),p=S.prods.find(x=>x.id===id),i=t.items.find(x=>x.pid===id);if(d>0&&p&&p.stock<=0)return;i.qty+=d;if(p)p.stock-=d;if(i.qty<=0)t.items=t.items.filter(x=>x!==i);save();render()}
function cancelTab(){const t=curTab();ask('Cancelar cuenta',[],()=>{t.items.forEach(i=>{const p=S.prods.find(x=>x.id===i.pid);if(p)p.stock+=i.qty});S.cash.tabs=S.cash.tabs.filter(x=>x!==t);cur=null;save()},'¿Cancelar la cuenta de '+t.name+'? Los productos vuelven al inventario.',true)}
function payTab(){const t=curTab(),sub=tabTotal(t);if(!sub)return;
  const calc=v=>{const method=v[0]==='card'||v[0]==='transfer'?v[0]:'cash',dv=parseFloat(v[2])||0,disc=Math.round(Math.min(sub,Math.max(0,v[1]==='p'?sub*dv/100:dv))*100)/100,tot=sub-disc,
    pct=method==='card'?Math.max(0,parseFloat(v[3])||0):0,sur=r2(tot*pct/100);return{method,disc,tot,pct,sur,total:r2(tot+sur)}};
  ask('Cobrar a '+t.name+' · '+money(sub),[{label:'Forma de pago',value:'cash',opts:[['cash','Efectivo'],['card','Tarjeta'],['transfer','Transferencia']]},{label:'Descuento: tipo',value:'m',opts:[['m','Monto (RD$)'],['p','Porcentaje (%)']]},{label:'Descuento: valor (vacío = sin descuento)',type:'number'},{label:'Recargo por tarjeta (%)',type:'number',value:lastPct(),show:[0,'card']},{label:'Monto recibido (vacío = paga todo; si es menor, el resto queda fiado)',type:'number'}],v=>{
    const{method,disc,tot,pct,sur,total}=calc(v);
    if(method==='card'&&(v[3]===''||isNaN(parseFloat(v[3]))))return alert('Escribe el % de recargo de la tarjeta (0 si no lleva recargo).');
    const r=v[4]===''?total:parseFloat(v[4]);if(isNaN(r)||r<0)return alert('Monto recibido inválido');
    const paid=Math.min(r,total),credit=Math.round((total-paid)*100)/100,change=method==='cash'?r-paid:0;
    if(method==='card')savePct(pct);
    const s={id:uid(),t:Date.now(),client:t.name,items:t.items.map(({pid,name,price,qty})=>({pid,name,price,qty})),subtotal:sub,discount:disc,surcharge:sur,spct:pct,total,paid,credit,change,method,by:me.name};
    S.cash.sales.push(s);S.log.push({id:s.id,t:s.t,type:'sale',total,paid,credit,method,items:s.items.map(i=>({name:i.name,amt:i.price*i.qty,qty:i.qty}))});
    if(credit>0)S.credits.push({id:uid(),client:t.name,total:credit,paid:0,date:s.t,pays:[],by:me.name});
    S.cash.tabs=S.cash.tabs.filter(x=>x!==t);cur=null;rcpt=s;save();
  });
  dlg.live=v=>{const c=calc(v);return'<span>Total a cobrar'+(c.sur?' <small class="mu">(incluye recargo '+money(c.sur)+')</small>':'')+'</span><b class="tot">'+money(c.total)+'</b>'};dlgVis();
}

/* ---------- PDF ---------- */
const W=64,pad=(l,r)=>{l=String(l);r=String(r);return l.slice(0,Math.max(1,W-r.length-1))+' '.repeat(Math.max(1,W-l.length-r.length))+r};
const ctr=t=>' '.repeat(Math.max(0,Math.floor((W-t.length)/2)))+t;
function mkPdf(lines){
  let wm=null,wg=null;try{wm=Uint8Array.from(atob(WM.split(',')[1]),c=>c.charCodeAt(0));wg=Uint8Array.from(atob(WMG.split(',')[1]),c=>c.charCodeAt(0))}catch(e){wm=null}
  const enc=s=>{const a=[];for(const ch of s){let c=ch.codePointAt(0);if(c===0x2212||c===0x2013)c=45;else if(c===0x202f||c===0xa0)c=32;else if(c>255)c=63;a.push(c)}return a};
  const pages=[];for(let i=0;i<lines.length;i+=60)pages.push(lines.slice(i,i+60));if(!pages.length)pages.push(['']);
  const parts=[],offs=[];let len=0;
  const put=s=>{const u=Uint8Array.from(enc(s));parts.push(u);len+=u.length};
  const obj=(n,b)=>{offs[n]=len;put(n+' 0 obj\n'+b+'\nendobj\n')};
  put('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Count '+pages.length+' /Kids ['+pages.map((_,k)=>(5+2*k)+' 0 R').join(' ')+'] >>');
  obj(3,'<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>');
  pages.forEach((pl,k)=>{
    const cs=(wm?'q /G1 gs 360 0 0 360 117 241 cm /Im1 Do Q\n':'')+'BT /F1 10 Tf 13 TL 50 790 Td\n'+pl.map(l=>'('+String(l).replace(/[\\()]/g,'\\$&')+') Tj T*').join('\n')+'\nET';
    obj(4+2*k,'<< /Length '+enc(cs).length+' >>\nstream\n'+cs+'\nendstream');
    obj(5+2*k,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Contents '+(4+2*k)+' 0 R /Resources << /Font << /F1 3 0 R >>'+(wm?' /XObject << /Im1 '+(4+2*pages.length)+' 0 R >> /ExtGState << /G1 << /ca 0.5 >> >>':'')+' >> >>');
  });
  if(wm){const N=4+2*pages.length;offs[N]=len;put(N+' 0 obj\n<< /Type /XObject /Subtype /Image /Width 360 /Height 360 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /SMask '+(N+1)+' 0 R /Length '+wm.length+' >>\nstream\n');parts.push(wm);len+=wm.length;put('\nendstream\nendobj\n');offs[N+1]=len;put((N+1)+' 0 obj\n<< /Type /XObject /Subtype /Image /Width 360 /Height 360 /ColorSpace /DeviceGray /BitsPerComponent 8 /Filter /DCTDecode /Length '+wg.length+' >>\nstream\n');parts.push(wg);len+=wg.length;put('\nendstream\nendobj\n')}
  const n=3+2*pages.length+(wm?2:0),xr=len;let x='xref\n0 '+(n+1)+'\n0000000000 65535 f \n';
  for(let i=1;i<=n;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  put(x+'trailer\n<< /Size '+(n+1)+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}
async function saveFile(name,blob){
  try{
    const d=window.claude&&await window.claude.use('downloads');
    if(d){await d.save({filename:name,data:blob});return true}
    const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true;
  }catch(e){if(!e||e.code!=='declined')alert('No se pudo guardar el archivo.');return false}
}
const savePdf=(lines,name)=>saveFile(name,mkPdf(lines));

function receiptLines(s){
  const sub=s.subtotal??s.total,dsc=s.discount||0,sur=s.surcharge||0,m=money,L=[ctr('SHE & HE'),ctr('Factura'),'',new Date(s.t).toLocaleString('es-DO'),'Cliente: '+s.client,'Atendió: '+s.by,'-'.repeat(W)];
  s.items.forEach(i=>L.push(pad(i.qty+' x '+String(i.name).slice(0,30),m(i.qty*i.price))));
  L.push('-'.repeat(W));
  if(dsc||sur)L.push(pad('Subtotal',m(sub)));if(dsc)L.push(pad('Descuento','-'+m(dsc)));if(sur)L.push(pad('Recargo tarjeta'+(s.spct?' ('+s.spct+'%)':''),'+'+m(sur)));
  L.push(pad('TOTAL',m(s.total)),pad('Pagado ('+(BM[s.method]||'Efectivo').toLowerCase()+')',m(s.paid??s.total)));
  if(s.credit>0)L.push(pad('Pendiente (fiado)',m(s.credit)));
  if(s.change>0)L.push(pad('Devuelta',m(s.change)));
  L.push('',ctr('¡Gracias por su visita!'));return L;
}
function reportLines(r){
  const d=t=>new Date(t).toLocaleString('es-DO'),m=money,fi=(r.snap?.sales||[]).filter(s=>s.credit>0);
  const L=[ctr('SHE & HE'),ctr('Cierre de caja'),'','Apertura: '+d(r.open)+' ('+r.openedBy+')','Cierre:   '+d(r.close)+' ('+r.closedBy+')','',pad('Producto','Cant x Precio = Total'),'-'.repeat(W)];
  r.items.forEach(i=>L.push(pad(String(i.name).slice(0,26),i.qty+' x '+i.price+' = '+i.qty*i.price)));
  if(!r.items.length)L.push('Sin ventas');
  L.push('-'.repeat(W),pad('Ventas ('+r.n+')',m(r.total)),pad('Cobrado en ventas',m(r.paid??r.total)));
  if(r.cardPaid)L.push(pad('Pagos con tarjeta (banco)',m(r.cardPaid)));
  if(r.surch)L.push(pad('  incluye recargo de tarjeta',m(r.surch)));
  if(r.trfPaid)L.push(pad('Pagos por transferencia (banco)',m(r.trfPaid)));
  if(r.disc)L.push(pad('Descuentos otorgados (ya restados)',m(r.disc)));
  fi.forEach(s=>L.push(pad('Fiado a '+s.client,m(s.credit))));
  (r.cols||[]).forEach(x=>L.push(pad('Pago de '+x.client+' (crédito anterior)'+(x.method==='card'?' [tarjeta]':x.method==='transfer'?' [transferencia]':''),'+'+m(x.amount))));
  (r.expenses||[]).forEach(x=>L.push(pad('Gasto: '+x.desc,'-'+m(x.amount))));
  L.push(pad('Fondo inicial',m(r.fund)),pad('Efectivo esperado',m(r.exp)));
  if(r.counted!=null)L.push(pad('Efectivo contado',m(r.counted)),pad('Diferencia',m(r.counted-r.exp)));
  return L;
}

let scan=null;
const scanErr=e=>({not_granted:'Debes permitir que Claude lea la foto cuando la app te lo pida.',images_unavailable:'Escanear fotos no está disponible en este dispositivo o visor.',rate_limited:'Se alcanzó el límite de uso. Intenta más tarde.',image_rejected:'No se pudo leer esa foto. Prueba con otra.',invalid_json:'No pude entender la factura. Prueba con una foto más clara.',sampling_disabled:'La lectura con IA no está disponible en esta cuenta.'})[e&&e.code]||'No se pudo escanear la factura. Intenta de nuevo.';
async function scanFile(inp){
  const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  scan={busy:true};render();
  try{
    const sample=window.claude&&await window.claude.use('sample');
    if(!sample)throw{code:'images_unavailable'};
    const lim=typeof sample.limits==='function'?await sample.limits():{};
    if(!lim||!lim.images)throw{code:'images_unavailable'};
    const list=S.prods.map(p=>p.id+' | '+p.name+' | '+p.cat).join('\n');
    const prompt='Esta es la foto de una factura de compra de mercancía (bebidas) de un negocio en República Dominicana. Extrae cada producto comprado. Devuelve SOLO JSON con esta forma: {"lines":[{"desc":"texto como aparece en la factura","packages":cantidad de cajas/paquetes comprados,"unitsPerPackage":unidades que trae cada caja o paquete (1 si es suelto),"units":packages*unitsPerPackage,"cost":costo total de esa línea en RD$ (0 si no se ve),"match":"id del producto de la lista o null"}]}. Usa match solo si es claramente el mismo producto de la lista. Si las unidades por caja no aparecen, deduce por la descripción (ej. "caja x24"). No inventes líneas ni precios.\n\nProductos del inventario (id | nombre | categoría):\n'+list;
    const data=await sample.json(prompt,{images:f,cache:false});
    const lines=(data.lines||[]).map(l=>({desc:String(l.desc||''),pid:S.prods.some(p=>p.id===l.match)?l.match:'',units:Math.max(0,Math.round(+l.units||0)),cost:Math.max(0,+l.cost||0)}));
    scan=lines.length?{lines}:{err:'No pude ver productos en la foto. Intenta con buena luz y la factura completa y derecha.'};
  }catch(e){scan={err:scanErr(e)}}
  render();
}
function vScan(){
  if(scan.busy)return`<div class="card"><b>Leyendo la factura…</b><p class="mu">Puede tardar unos segundos. No cierres esta pantalla.</p></div>`;
  if(scan.err)return`<div class="card"><b class="bad">${esc(scan.err)}</b><br><br><button onclick="scan=null;render()">Volver</button></div>`;
  return`<div class="card"><b>Revisa la factura leída</b><p class="mu" style="font-size:13px">Verifica producto, unidades y costo. Las líneas sin producto no se guardan.</p>
  ${scan.lines.map((l,i)=>`<div class="sp" style="flex-direction:column;align-items:stretch;gap:6px"><small class="mu">${esc(l.desc)}</small>
  <select onchange="scan.lines[${i}].pid=this.value"><option value="">— No agregar —</option>${S.prods.map(p=>`<option value="${p.id}" ${p.id===l.pid?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
  <div class="row"><div><small class="mu">Unidades</small><input type="number" inputmode="numeric" value="${l.units}" oninput="scan.lines[${i}].units=parseInt(this.value)||0"></div><div><small class="mu">Costo total RD$</small><input type="number" inputmode="decimal" value="${l.cost}" oninput="scan.lines[${i}].cost=parseFloat(this.value)||0"></div></div></div>`).join('')}
  <div class="row" style="margin-top:12px"><button class="g" onclick="scan=null;render()">Cancelar</button><button onclick="confirmScan()">Sumar al inventario</button></div></div>`;
}
function confirmScan(){

}

function nbSave(){
  const L=nb.lines.map(l=>({pid:l.pid,units:parseFloat(l.units),cost:parseFloat(l.cost)}));
  for(let i=0;i<L.length;i++){const l=L[i];if(!S.prods.some(p=>p.id===l.pid)||!(l.units>0)||!(l.cost>0))return alert('Revisa el producto '+(i+1)+': elige el producto y escribe unidades y costo mayores que 0. Si sobra una línea, quítala con ✕.')}
  const c=r2(L.reduce((a,l)=>a+l.cost,0));let fund=c,pers=0;
  if(nb.how==='personal'){fund=0;pers=c}
  else if(nb.how==='mixed'){fund=parseFloat(nb.fund);if(!(fund>0)||fund>=c)return alert('En un pago mixto, el monto del fondo debe ser mayor que 0 y menor que el total ('+money(c)+')');pers=r2(c-fund)}
  const today=new Date().toLocaleDateString('en-CA'),t=nb.date===today?Date.now():new Date(nb.date+'T12:00:00').getTime();if(isNaN(t))return alert('Fecha inválida');
  const gid=uid(),inv=(nb.inv||'').trim();let fl=0;
  L.forEach((l,i)=>{const p=S.prods.find(x=>x.id===l.pid);
    let f=i===L.length-1?r2(fund-fl):r2(fund*l.cost/c);f=Math.min(l.cost,Math.max(0,f));fl=r2(fl+f);
    const b={id:uid(),gid,ln:i,t,pid:p.id,name:p.name,units:l.units,cost:l.cost,inv,stock:nb.stock==='1',pay:{fund:f,personal:r2(l.cost-f),account:nb.acct==='bank'?'bank':'cash',kind:nb.kind==='capital'?'capital':'loan'}};
    S.buys.unshift(b);S.log.push({id:b.id,t,type:'buy',amount:l.cost,name:p.name});if(b.stock)p.stock+=l.units});
  nb=null;save();render();
}

let cm='u';
function donutHTML(L){

function sim(){
  const st0=S.cfg?S.cfg.start:0,ev=[];
  S.buys.forEach(b=>{if(!b.void&&b.t>=st0&&b.units>0)ev.push({t:b.t,k:0,b})});
  S.log.forEach(e=>{if(e.type==='sale'&&!e.void&&e.t>=st0)ev.push({t:e.t,k:1,e})});
  ev.sort((a,b)=>a.t-b.t||a.k-b.k);
  const st={},val={},last={},uc={},first={};
  ev.forEach(x=>{if(x.k===0&&first[x.b.name]==null)first[x.b.name]=x.b.cost/x.b.units});
  ev.forEach(x=>{
    if(x.k===0){const n=x.b.name;st[n]=(st[n]||0)+x.b.units;val[n]=(val[n]||0)+x.b.cost;last[n]=val[n]/st[n]}
    else(x.e.items||[]).forEach((i,ix)=>{const n=i.name,q=i.qty||0,s=st[n]||0,a=s>0?val[n]/s:(last[n]!=null?last[n]:first[n]);
      if(a!=null){uc[x.e.id+'|'+ix]=a;const take=Math.min(q,s);st[n]=s-take;val[n]=Math.max(0,(val[n]||0)-take*a)}})});
  return{uc,avg:n=>(st[n]>0?val[n]/st[n]:(last[n]||0))};
}
const barState=s=>({pct:Math.max(0,Math.min(100,s/((S.cfg&&S.cfg.ref)||10000)*100)),color:s>5000?'#2e9e4f':s>1000?'#e0a800':'#d64545',warn:s<0});
function fondoCalc(from,to){
  const c=S.cfg||{start:0,cash:0,bank:0},A={cash:c.cash||0,bank:c.bank||0};let capital=A.cash+A.bank,loans=0;
  const add=(a,v)=>{A[a==='bank'?'bank':'cash']+=v},ok=x=>!x.void&&x.t>=c.start;
  S.log.forEach(e=>{if(!ok(e))return;
    if(e.type==='sale')add(acctOf(e.method),e.paid);
    else if(e.type==='col')add(acctOf(e.method),e.amount);
    else if(e.type==='exp')add('cash',-e.amount);
    else if(e.type==='wd')add(e.account,-e.amount)});
  S.buys.forEach(b=>{if(!ok(b))return;const p=b.pay||{fund:b.cost,personal:0,account:'cash'};
    add(p.account,-p.fund);if(p.personal>0){if(p.kind==='loan')loans+=p.personal;else capital+=p.personal}});
  (S.movs||[]).forEach(m=>{if(!ok(m))return;const a=m.amount;
    if(m.type==='aporte'){add(m.account,a);capital+=a}else if(m.type==='prestamo'){add(m.account,a);loans+=a}
    else if(m.type==='devolucion'){add(m.account,-a);loans-=a}else if(m.type==='gasto')add(m.account,-a);
    else if(m.type==='transfer'){add(m.from,-a);add(m.to,a)}});
  S.rpays.forEach(c=>{if(ok(c))add(c.account,c.amount)});
  const U=sim(),saldo=A.cash+A.bank,inv=S.prods.reduce((x,p)=>x+Math.max(0,p.stock)*U.avg(p.name),0),pend=S.credits.reduce((x,k)=>x+k.total-k.paid,0);
  const f=Math.max(from,c.start),r={ventas:0,cogs:0,gastos:0,retiros:0,rentas:0};
  S.log.forEach(e=>{if(e.void||e.t<f||e.t>=to)return;
    if(e.type==='sale'){r.ventas+=e.total;(e.items||[]).forEach((i,ix)=>{r.cogs+=(i.qty||0)*(U.uc[e.id+'|'+ix]||0)})}
    else if(e.type==='exp')r.gastos+=e.amount;else if(e.type==='wd')r.retiros+=e.amount});
  (S.movs||[]).forEach(m=>{if(!m.void&&m.type==='gasto'&&m.t>=f&&m.t<to)r.gastos+=m.amount});
  S.rpays.forEach(c=>{if(!c.void&&c.t>=f&&c.t<to)r.rentas+=c.amount});
  return{cash:A.cash,bank:A.bank,saldo,capital,loans,inv,pend,rpend:rentPending(),total:saldo+inv+pend+rentPending(),ventas:r.ventas,cogs:r.cogs,bruta:r.ventas-r.cogs,gastos:r.gastos,rentas:r2(r.rentas),neta:r.ventas-r.cogs-r.gastos+r.rentas,retiros:r.retiros,bar:barState(saldo)};
}

const DAY=864e5,r2=n=>Math.round(n*100)/100;
const dday=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const dkey=t=>{const d=new Date(t);return''+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')};
const dstr=t=>new Date(t).toLocaleDateString('es-DO'),dIn=t=>new Date(t).toLocaleDateString('en-CA');
const FQ={w:'Semanal',q:'Quincenal',m:'Mensual'},MET={cash:'Efectivo',transfer:'Transferencia',other:'Otro'},SCOPE={general:'General',ventas:'Ventas',rentas:'Rentas',otros:'Otros'};
const suggest=(rate,f)=>f==='w'?rate:f==='q'?Math.round(rate*15/7):Math.round(rate*52/12);

/* Períodos: semanal +7 días, quincenal +15 días, mensual mismo día del mes (ajustado si el mes es más corto). El período vence el día que empieza. */
function nextStart(t,freq,anchor){
  const d=new Date(t);
  if(freq==='w')return new Date(d.getFullYear(),d.getMonth(),d.getDate()+7).getTime();
  if(freq==='q')return new Date(d.getFullYear(),d.getMonth(),d.getDate()+15).getTime();
  const ad=new Date(anchor).getDate(),y=d.getFullYear(),mo=d.getMonth()+1,last=new Date(y,mo+1,0).getDate();
  return new Date(y,mo,Math.min(ad,last)).getTime();
}
const rpLive=()=>S.rpers.filter(r=>!r.void);
const rpPaid=rid=>r2(S.rpays.reduce((a,c)=>c.void?a:a+(c.alloc||[]).reduce((x,l)=>l.rid===rid?x+l.amt:x,0),0));
const rpBal=r=>r2(r.amount-rpPaid(r.id));
const profPend=pid=>r2(rpLive().filter(r=>r.pid===pid).reduce((a,r)=>a+Math.max(0,rpBal(r)),0));
const profCredit=pid=>r2(S.rpays.filter(c=>c.pid===pid&&!c.void).reduce((a,c)=>a+c.amount-(c.alloc||[]).reduce((x,l)=>x+l.amt,0),0));
function rentPending(){return r2(rpLive().reduce((a,r)=>a+Math.max(0,rpBal(r)),0))}
const lastTo=pid=>S.rpers.filter(r=>r.pid===pid).reduce((a,r)=>Math.max(a,r.to),0);
function applyCredit(pid){
  const pays=S.rpays.filter(c=>c.pid===pid&&!c.void).sort((a,b)=>a.t-b.t),pers=rpLive().filter(r=>r.pid===pid).sort((a,b)=>a.from-b.from);
  for(const r of pers){let b=rpBal(r);if(b<=0.005)continue;
    for(const c of pays){const free=r2(c.amount-(c.alloc||[]).reduce((x,l)=>x+l.amt,0));if(free<=0.005)continue;
      const take=Math.min(free,b);(c.alloc=c.alloc||[]).push({rid:r.id,amt:r2(take),t:Date.now()});b=r2(b-take);if(b<=0.005)break}}
}
/* Los ids de período son fijos (profesional + fecha): si dos dispositivos generan a la vez, el período nunca se duplica. */
function genPeriods(now){
  now=now||Date.now();const td=dday(now);let n=0;
  S.rprofs.forEach(p=>{if(!p.active||p.auto===false||!(p.amount>0))return;
    const fin=p.cob==='f',mine=S.rpers.filter(r=>r.pid===p.id);let nx=mine.length?Math.max(...mine.map(r=>r.to)):dday(p.start);
    if(p.gap&&nx<p.gap)nx=p.gap;
    for(let g=0;g<400;g++){
      const to=nextStart(nx,p.freq,p.fa||p.start);
      if(fin?to>td:nx>td)break;
      const id='rr_'+p.id+'_'+dkey(nx);
      if(!S.rpers.some(r=>r.id===id)){S.rpers.push({id,type:'rper',pid:p.id,from:nx,to,due:fin?to:nx,amount:p.amount,freq:p.freq,t:now});n++}
      nx=to}
    applyCredit(p.id)});
  return n;
}
function recordRent(o){
  const p=S.rprofs.find(x=>x.id===o.pid);if(!p)return'Elige un profesional';
  const a=r2(o.amount);if(!(a>0))return'Escribe un monto mayor que 0';
  const t=!o.date||o.date===dIn(Date.now())?Date.now():new Date(o.date+'T12:00:00').getTime();if(isNaN(t))return'Fecha inválida';
  const method=MET[o.method]?o.method:'cash',account=method==='cash'?'cash':method==='transfer'?'bank':(o.account==='bank'?'bank':'cash'),ref=(o.ref||'').trim(),live=S.rpays.filter(c=>!c.void);
  if(ref&&live.some(c=>c.ref&&c.ref.toLowerCase()===ref.toLowerCase()))return'Ya existe un cobro con esa referencia. No se registró de nuevo.';
  if(live.some(c=>c.pid===p.id&&c.amount===a&&c.method===method&&Date.now()-(c.at||0)<120000))return'Este cobro ya se registró hace un momento. No se duplicó.';
  const pend=profPend(p.id);
  if(a>pend+0.005&&o.over!=='credit')return'El monto ('+money(a)+') supera lo pendiente ('+money(pend)+'). Ajusta el monto o elige dejar el resto como pago anticipado.';
  S.rpays.push({id:'rc_'+uid(),type:'rpay',t,at:Date.now(),pid:p.id,name:p.name,amount:a,method,account,ref,notes:(o.notes||'').trim(),alloc:[],by:me?me.name:''});
  applyCredit(p.id);return null;
}
function payRent(pid){

function flujo(from,to){

    else if(e.type==='exp')add('Gastos del negocio','cash',-e.amount);else if(e.type==='wd')add('Retiros personales',e.account,-e.amount)});
  S.rpays.forEach(c=>{if(ok(c))add('Cobros de renta',c.account,c.amount)});
  S.buys.forEach(b=>{if(!ok(b))return;const p=b.pay||{fund:b.cost,account:'cash'};add('Compras de mercancía',p.account,-p.fund)});
  (S.movs||[]).forEach(x=>{if(!ok(x))return;const a=x.amount;

function costFn(){
  const B={};[...S.buys].sort((a,b)=>a.t-b.t).forEach(b=>(B[b.name]=B[b.name]||[]).push(b));
  return(name,t)=>{const L=B[name];if(!L)return null;let u=0,c=0;
    for(const b of L){if(b.t>t)break;u+=b.units;c+=b.cost}
    if(!u)L.forEach(b=>{u+=b.units;c+=b.cost});
    return u?c/u:null};
}
function range(from,to){
  const U=sim(),P={};let paid=0,exp=0,wd=0,sales=0,rent=0;
  S.log.forEach(e=>{if(e.void||e.t<from||e.t>=to)return;
    if(e.type==='sale'){const its=e.items||[],sub=its.reduce((a,i)=>a+i.amt,0),k=sub>0?e.total/sub:1;sales+=e.total;paid+=e.paid;
      its.forEach((i,ix)=>{const p=P[i.name]=P[i.name]||{q:0,rev:0,cost:0,no:false},uc=U.uc[e.id+'|'+ix];p.q+=i.qty||0;p.rev+=i.amt*k;if(uc==null)p.no=true;else p.cost+=uc*(i.qty||0)})}
    else if(e.type==='col')paid+=e.amount;else if(e.type==='exp')exp+=e.amount;else if(e.type==='wd')wd+=e.amount});
  S.rpays.forEach(c=>{if(!c.void&&c.t>=from&&c.t<to)rent+=c.amount});(S.movs||[]).forEach(x=>{if(!x.void&&x.type==='gasto'&&x.t>=from&&x.t<to)exp+=x.amount});
  const rows=Object.entries(P).map(([n,p])=>({n,q:p.q,rev:p.rev,cost:p.cost,no:p.no,gain:p.rev-p.cost})).sort((a,b)=>b.gain-a.gain);
  const cogs=rows.reduce((a,r)=>a+r.cost,0),net=paid+rent-cogs-exp;
  return{rows,sales,paid,rent,exp,wd,cogs,net,avail:net-wd,miss:rows.some(r=>r.no)};
}

  ask('Editar producto',[{label:'Nombre',value:p.name},{label:'Categoría',value:p.cat,opts:S.cats.map(c=>[c,c])},{label:'Precio',type:'number',value:p.price},{label:'Stock actual',type:'number',value:p.stock},{label:'Stock mínimo',type:'number',value:p.min}],v=>{
  const pr=parseFloat(v[2]),st=parseInt(v[3]),m=parseInt(v[4]);if(!v[0].trim()||isNaN(pr))return alert('Nombre y precio son obligatorios');
  p.name=v[0].trim();p.cat=v[1];p.price=pr;if(!isNaN(st))p.stock=st;if(!isNaN(m))p.min=m;save()})}
function delProd(id){ask('Eliminar producto',[],()=>{S.prods=S.prods.filter(p=>p.id!==id);save()},'¿Eliminar este producto?',true)}
function vProd(){
  return`<div class="card"><b>Categorías</b><div class="row" style="margin:8px 0">${S.cats.map(c=>`<button class="g" onclick="delCat('${esc(c)}')">${esc(c)} ✕</button>`).join('')}</div>
  <div class="row"><input id="nc" placeholder="Nueva categoría"><button onclick="addCat()">Añadir</button></div></div>
  <div class="card"><b>Nuevo producto</b><div class="row" style="margin-top:8px"><input id="pn" placeholder="Nombre"><select id="pc">${S.cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select><input id="pp" type="number" placeholder="Precio"><input id="ps" type="number" placeholder="Stock"><input id="pm" type="number" placeholder="Mínimo"></div><p class="mu" style="margin:10px 0 4px;font-size:13px">Foto del producto (opcional)</p><input id="pf" type="file" accept="image/*"><br><button onclick="addProd()">Guardar producto</button><input id="pfx" type="file" accept="image/*" hidden onchange="photoPicked(this)"></div>
  <div class="card">${S.prods.map(p=>`<div class="sp"><span style="display:flex;align-items:center;gap:8px">${pimg(p)?`<img src="${pimg(p)}" alt="" style="width:30px;height:44px;object-fit:cover;border-radius:5px;background:#000">`:''}<span>${esc(p.name)} <small class="mu">${esc(p.cat)} · ${money(p.price)} · mín ${p.min}</small></span></span><span><button class="g" onclick="setPhoto('${p.id}')">Foto</button> <button class="g" onclick="editProd('${p.id}')">Editar</button> <button class="g" onclick="delProd('${p.id}')">✕</button></span></div>`).join('')}</div>`;
}

/* ---------- Usuarios (admin) ---------- */
const apiMsg=m=>e=>alert((e&&e.msg&&e.msg!=='server'?e.msg:m));
function addUser(){
  const n=$('#un').value.trim(),u=$('#uu').value.trim().toLowerCase(),p=$('#up').value,r=$('#ur').value;
  if(!n||!u||p.length<4)return alert('Nombre, usuario y contraseña (mín. 4)');
  api('/api/users',{action:'add',name:n,user:u,pass:p,role:r}).then(()=>refresh(true)).catch(apiMsg('No se pudo crear el usuario'));
}
function editUser(id){const u=S.users.find(x=>x.id===id);
  ask('Editar usuario',[{label:'Nombre',value:u.name},{label:'Usuario',value:u.user},{label:'Rol',value:u.role,opts:[['seller','Vendedor'],['admin','Administrador']]},{label:'Nueva contraseña (vacío = no cambiar)',type:'password',value:''}],v=>{
    if(!v[0].trim()||!v[1].trim())return alert('Nombre y usuario son obligatorios');
    if(v[3]&&v[3].length<4)return alert('La contraseña debe tener mínimo 4 caracteres');
    api('/api/users',{action:'edit',id,name:v[0],user:v[1],role:v[2],pass:v[3]}).then(()=>refresh(true)).catch(apiMsg('No se pudo guardar'));
  })}
function delUser(id){if(id===me.id)return;const u=S.users.find(x=>x.id===id);
  ask('Eliminar usuario',[],()=>{api('/api/users',{action:'del',id}).then(()=>refresh(true)).catch(apiMsg('No se pudo eliminar'))},'¿Eliminar a '+u.name+'? No podrá volver a entrar.',true)}
function vUsers(){
  return`<div class="card"><b>Nuevo usuario</b><div class="row" style="margin-top:8px"><input id="un" placeholder="Nombre"><input id="uu" placeholder="Usuario"><input id="up" type="password" placeholder="Contraseña"><select id="ur"><option value="seller">Vendedor</option><option value="admin">Administrador</option></select></div><br><button onclick="addUser()">Crear</button></div>
  <div class="card">${S.users.map(u=>`<div class="sp"><span>${esc(u.name)} <small class="mu">@${esc(u.user)} · ${u.role==='admin'?'Admin':'Vendedor'}</small></span><span><button class="g" onclick="editUser('${u.id}')">Editar</button> ${u.id===me.id?'':`<button class="g" onclick="delUser('${u.id}')">✕</button>`}</span></div>`).join('')}</div>`;
}

/* ---------- Shell ---------- */
function render(){
  const a=$('#app');
  if(!me){a.innerHTML=`<div style="position:fixed;inset:0;background:#000 url(${LOGO}) center/contain no-repeat"></div><div style="position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)"></div><div class="login" style="position:relative;color:#f2ead6"><h1 style="font:italic 34px Georgia,serif;color:#d4af37;text-align:center;margin:0 0 4px">She &amp; He</h1><p class="mu" style="text-align:center">Control de caja</p>
  <input id="lu" placeholder="Usuario" autocapitalize="none"><br><br><input id="lp" type="password" placeholder="Contraseña" onkeydown="if(event.key==='Enter')login()"><br><br>
  <button style="width:100%" onclick="login()">Entrar</button><p class="bad">${esc(err)}</p><p class="mu" style="text-align:center;font-size:13px">Primer acceso: admin / admin123 (cámbiala en Usuarios)</p></div>`;return}
  const tabs=[['venta','Venta'],['caja','Caja'],['cred','Créditos'],['inv','Inventario']];
  if(isAdmin())tabs.push(['stats','Estadísticas'],['fondo','Fondo'],['rent','Rentas'],['res','Resumen'],['gan','Ganancias'],['buys','Compras'],['prod','Productos'],['users','Usuarios']);
  const v={rent:vRent,res:vRes,venta:vVenta,caja:vCaja,cred:vCred,buys:vBuys,stats:vStats,gan:vGan,fondo:vFondo,inv:vInv,prod:vProd,users:vUsers};
  if(!tabs.some(t=>t[0]===tab))tab='venta';
  a.innerHTML=`<header class="np"><span><b>She &amp; He</b> <small class="mu" style="font-size:11px">v ${VERSION}</small></span><span class="mu">${esc(me.name)} <button class="g" onclick="logout()">Salir</button></span></header>
  <nav class="np">${tabs.map(t=>`<button class="${t[0]===tab?'':'g'}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</nav>${offline?'<div class="card bad np" style="margin:10px 12px">Sin conexión: los cambios se guardarán cuando vuelva el internet.</div>':''}<main>${rcpt?receiptHTML(rcpt):v[tab]()}</main>${dlgHTML()}`;
  if(dlg){dlgVis();const f=$('#df0');if(f&&f.tagName==='INPUT'){f.focus();f.select()}}
}
boot();
</script></body></html>
